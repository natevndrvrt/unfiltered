<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unfiltered</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0b;
    --surface: #111114;
    --surface2: #18181d;
    --border: #2a2a35;
    --orange: #e8651a;
    --orange-dim: #c44e0e;
    --orange-glow: rgba(232,101,26,0.12);
    --neon: #7efff5;
    --text: #d4cfc8;
    --text-dim: #6b6760;
    --text-bright: #f0ece5;
    --red: #e84040;
    --green: #40e87a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Sinhala Sangam MN', 'Noto Sans', Geneva, sans-serif;
    font-size: 18px;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1000;
    opacity: 0.35;
  }

  body::after {
    content: '';
    position: fixed;
    top: -200px; left: 50%;
    transform: translateX(-50%);
    width: 600px; height: 400px;
    background: radial-gradient(ellipse, rgba(232,101,26,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .app {
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 24px 120px;
    position: relative;
    z-index: 1;
  }

  /* ── Header ── */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 48px;
    opacity: 0;
    animation: fadeUp 0.7s ease forwards;
  }

  .brand {
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.25em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .brand span { color: var(--orange); }

  .header-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }

  .date-display {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    text-align: right;
  }

  .sync-status {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-dim);
  }

  .sync-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: background 0.3s;
  }

  .sync-dot.ok { background: var(--green); }
  .sync-dot.saving { background: var(--orange); animation: pulse 1s infinite; }
  .sync-dot.error { background: var(--red); }

  /* ── Google auth banner ── */
  .auth-banner {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 2px solid var(--orange);
    padding: 20px 24px;
    margin-bottom: 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    opacity: 0;
    animation: fadeUp 0.7s ease 0.1s forwards;
  }

  .auth-banner.hidden { display: none; }

  .auth-banner-text {
    font-size: 15px;
    font-style: italic;
    color: var(--text);
    line-height: 1.5;
  }

  .auth-banner-sub {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    margin-top: 4px;
  }

  .btn-google {
    background: var(--orange);
    color: #0a0a0b;
    border: none;
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 10px 18px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.2s;
    flex-shrink: 0;
  }

  .btn-google:hover { background: #f07020; }

  /* ── Nav ── */
  .nav {
    display: flex;
    margin-bottom: 40px;
    border-bottom: 1px solid var(--border);
    opacity: 0;
    animation: fadeUp 0.7s ease 0.1s forwards;
  }

  .nav-btn {
    background: none; border: none;
    color: var(--text-dim);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 10px 24px 10px 0;
    cursor: pointer;
    position: relative;
    transition: color 0.2s;
  }

  .nav-btn.active { color: var(--orange); }
  .nav-btn.active::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 0; right: 24px;
    height: 1px;
    background: var(--orange);
  }
  .nav-btn:hover:not(.active) { color: var(--text); }

  /* ── Views ── */
  .view { display: none; }
  .view.active { display: block; }

  /* ── Streak ── */
  .streak-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 36px;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    opacity: 0;
    animation: fadeUp 0.7s ease 0.15s forwards;
  }

  .streak-num {
    color: var(--orange);
    font-size: 22px;
    font-family: 'Sinhala Sangam MN', 'Noto Sans', Geneva, sans-serif;
    font-style: italic;
    font-weight: 300;
  }

  .streak-dots { display: flex; gap: 4px; }
  .streak-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); }
  .streak-dot.filled { background: var(--orange); }

  /* ── Prompt ── */
  .prompt-section { opacity: 0; animation: fadeUp 0.7s ease 0.2s forwards; }

  .prompt-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .prompt-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 2px solid var(--orange);
    padding: 24px 28px;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }

  .prompt-box::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--orange-glow);
    pointer-events: none;
  }

  .prompt-type-badge {
    display: inline-block;
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--orange);
    border: 1px solid var(--orange-dim);
    padding: 3px 8px;
    margin-bottom: 10px;
  }

  .prompt-text {
    font-size: 18px;
    font-style: normal;
    font-weight: 400;
    line-height: 1.65;
    color: var(--text-bright);
    position: relative;
  }

  /* ── Textarea ── */
  .entry-wrap { position: relative; }

  textarea {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-bright);
    font-family: 'Sinhala Sangam MN', 'Noto Sans', Geneva, sans-serif;
    font-size: 17px;
    font-weight: 400;
    line-height: 1.7;
    padding: 20px 24px;
    resize: vertical;
    min-height: 200px;
    outline: none;
    transition: border-color 0.2s;
  }

  textarea:focus { border-color: var(--orange-dim); }
  textarea::placeholder { color: var(--text-dim); font-style: italic; }

  .autosave-indicator {
    position: absolute;
    bottom: 10px;
    right: 14px;
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    transition: color 0.3s;
    pointer-events: none;
  }

  .autosave-indicator.saving { color: var(--orange); }
  .autosave-indicator.saved { color: var(--green); }

  .action-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
  }

  .word-count {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
  }

  /* ── Buttons ── */
  .btn-primary {
    background: var(--orange); color: #0a0a0b; border: none;
    font-family: 'DM Mono', monospace; font-size: 10px;
    letter-spacing: 0.25em; text-transform: uppercase;
    padding: 11px 24px; cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  .btn-primary:hover { background: #f07020; }
  .btn-primary:active { transform: scale(0.98); }

  .btn-ghost {
    background: none; border: 1px solid var(--border);
    color: var(--text-dim); font-family: 'DM Mono', monospace;
    font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    padding: 9px 18px; cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }
  .btn-ghost:hover { border-color: var(--text-dim); color: var(--text); }

  /* ── Already logged ── */
  .already-logged {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 28px;
    text-align: center;
  }

  .already-logged-icon { font-size: 28px; margin-bottom: 10px; }
  .already-logged-title { font-size: 18px; font-style: normal; color: var(--text-bright); margin-bottom: 6px; }
  .already-logged-text { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text-dim); letter-spacing: 0.08em; line-height: 1.6; }

  /* ── Goals ── */
  .goals-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
  .section-title { font-size: 26px; font-weight: 300; font-style: italic; color: var(--text-bright); }
  .goals-list { margin-bottom: 40px; }

  .goal-item {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 18px 20px;
    margin-bottom: 10px;
    display: flex;
    gap: 14px;
    align-items: flex-start;
    transition: border-color 0.2s;
  }

  .goal-item:hover { border-color: #3a3a48; }
  .goal-item.completed { opacity: 0.4; border-color: transparent; }
  .goal-item.completed .goal-text { text-decoration: line-through; }

  .goal-check {
    width: 17px; height: 17px;
    border: 1px solid var(--border);
    background: none; cursor: pointer;
    flex-shrink: 0; margin-top: 3px;
    position: relative; transition: border-color 0.2s;
  }
  .goal-check:hover { border-color: var(--green); }
  .goal-check.checked { background: var(--green); border-color: var(--green); }
  .goal-check.checked::after {
    content: '✓';
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: #0a0a0b;
    font-family: 'DM Mono', monospace;
  }

  .goal-content { flex: 1; }
  .goal-text { font-size: 16px; font-weight: 300; line-height: 1.5; color: var(--text-bright); margin-bottom: 5px; }
  .goal-meta { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--text-dim); letter-spacing: 0.1em; display: flex; gap: 14px; }

  .goal-actions { opacity: 0; transition: opacity 0.2s; }
  .goal-item:hover .goal-actions { opacity: 1; }

  .icon-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 13px; padding: 3px; transition: color 0.2s; }
  .icon-btn:hover { color: var(--red); }

  .add-goal-form { background: var(--surface); border: 1px solid var(--border); padding: 20px; margin-top: 20px; display: none; }
  .add-goal-form.open { display: block; }
  .form-row { display: flex; gap: 10px; margin-bottom: 10px; }

  input[type="text"], select {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text-bright); font-family: 'Sinhala Sangam MN', 'Noto Sans', Geneva, sans-serif;
    font-size: 16px; padding: 9px 12px; outline: none;
    transition: border-color 0.2s; flex: 1;
  }
  select { font-family: 'DM Mono', monospace; font-size: 10px; cursor: pointer; }
  input[type="text"]:focus, select:focus { border-color: var(--orange-dim); }

  /* ── Archive ── */
  .entry-item { border-bottom: 1px solid var(--border); padding: 24px 0; cursor: pointer; transition: padding 0.2s; }
  .entry-item:hover { padding-left: 8px; }
  .entry-date { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text-dim); letter-spacing: 0.12em; margin-bottom: 7px; display: flex; gap: 14px; }
  .entry-prompt-preview { font-size: 13px; font-style: italic; color: var(--text-dim); margin-bottom: 8px; }
  .entry-response-preview { font-size: 16px; font-weight: 300; color: var(--text); line-height: 1.6; }
  .entry-expanded { margin-top: 14px; padding: 18px 22px; background: var(--surface); border-left: 2px solid var(--border); display: none; }
  .entry-expanded.open { display: block; }
  .entry-full { font-size: 17px; font-weight: 300; line-height: 1.75; color: var(--text-bright); white-space: pre-wrap; }

  /* ── Goal modal ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(10,10,11,0.85);
    z-index: 100; display: none;
    align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-top: 2px solid var(--orange);
    padding: 36px; max-width: 520px; width: 100%; margin: 20px;
  }

  .modal-title { font-size: 20px; font-style: normal; font-weight: 400; color: var(--text-bright); margin-bottom: 6px; }
  .modal-sub { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text-dim); letter-spacing: 0.15em; margin-bottom: 24px; }
  .modal-goal { font-size: 16px; font-weight: 300; color: var(--text); background: var(--surface2); border: 1px solid var(--border); padding: 14px 18px; margin-bottom: 18px; line-height: 1.5; }
  .modal-btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-complete { background: var(--green); color: #0a0a0b; border: none; font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; padding: 10px 18px; cursor: pointer; }
  .btn-remove { background: none; border: 1px solid var(--red); color: var(--red); font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; padding: 10px 18px; cursor: pointer; }
  .btn-keep { background: none; border: 1px solid var(--border); color: var(--text-dim); font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; padding: 10px 18px; cursor: pointer; }

  /* ── Loading ── */
  .loading-prompt { display: flex; align-items: center; gap: 10px; color: var(--text-dim); font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.1em; padding: 16px 0; }
  .pulse-dot { width: 6px; height: 6px; background: var(--orange); border-radius: 50%; animation: pulse 1.2s ease-in-out infinite; }
  .pulse-dot:nth-child(2) { animation-delay: 0.2s; }
  .pulse-dot:nth-child(3) { animation-delay: 0.4s; }

  .empty-state { text-align: center; padding: 56px 0; color: var(--text-dim); font-style: italic; font-size: 17px; }

  /* ── Toast ── */
  .toast {
    position: fixed; bottom: 28px; right: 28px;
    background: var(--surface); border: 1px solid var(--border);
    border-left: 2px solid var(--orange);
    padding: 12px 18px; font-family: 'DM Mono', monospace;
    font-size: 11px; letter-spacing: 0.1em; color: var(--text);
    z-index: 200; transform: translateY(60px); opacity: 0;
    transition: transform 0.3s ease, opacity 0.3s ease;
  }
  .toast.show { transform: translateY(0); opacity: 1; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%,100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="brand"><span>//</span> Unfiltered</div>
    <div class="header-right">
      <div class="date-display" id="dateDisplay"></div>
      <div class="sync-status">
        <div class="sync-dot" id="syncDot"></div>
        <span id="syncLabel">local only</span>
      </div>
    </div>
  </div>

  <!-- Google auth banner -->
  <div class="auth-banner" id="authBanner">
    <div>
      <div class="auth-banner-text">Connect Google Drive to sync across devices.</div>
      <div class="auth-banner-sub">Your entries will be saved to a private file in your Drive.</div>
    </div>
    <button class="btn-google" onclick="signInGoogle()">Connect Drive</button>
  </div>

  <div class="nav">
    <button class="nav-btn active" onclick="switchView('today', this)">Today</button>
    <button class="nav-btn" onclick="switchView('goals', this)">Goals</button>
    <button class="nav-btn" onclick="switchView('archive', this)">Archive</button>
  </div>

  <!-- TODAY -->
  <div class="view active" id="view-today">
    <div class="streak-bar">
      <span class="streak-num" id="streakNum">0</span>
      <span>day streak</span>
      <div class="streak-dots" id="streakDots"></div>
    </div>

    <div class="prompt-section">
      <div class="prompt-label">Today's Prompt</div>
      <div id="promptContainer">
        <div class="loading-prompt">
          <div class="pulse-dot"></div><div class="pulse-dot"></div><div class="pulse-dot"></div>
          <span>Generating your prompt...</span>
        </div>
      </div>
      <div id="entryArea" style="display:none">
        <div class="entry-wrap">
          <textarea id="entryText" placeholder="Write honestly. Nobody else is reading this."></textarea>
          <div class="autosave-indicator" id="autosaveIndicator">draft</div>
        </div>
        <div class="action-row">
          <span class="word-count" id="wordCount">0 words</span>
          <div style="display:flex;gap:10px;align-items:center">
            <button class="btn-ghost" onclick="regeneratePrompt()">New prompt</button>
            <button class="btn-primary" onclick="saveEntry()">Save entry</button>
          </div>
        </div>
      </div>
      <div id="alreadyLogged" style="display:none">
        <div class="already-logged">
          <div class="already-logged-icon">◎</div>
          <div class="already-logged-title">You've written today.</div>
          <div class="already-logged-text" id="todayPreview"></div>
        </div>
        <div style="margin-top:14px;text-align:right">
          <button class="btn-ghost" onclick="switchView('archive', document.querySelectorAll('.nav-btn')[2])">Read it back</button>
        </div>
      </div>
    </div>
  </div>

  <!-- GOALS -->
  <div class="view" id="view-goals">
    <div class="goals-header">
      <div class="section-title">Goals</div>
      <button class="btn-ghost" onclick="toggleAddGoal()">+ Add</button>
    </div>
    <div class="add-goal-form" id="addGoalForm">
      <div class="form-row">
        <input type="text" id="goalInput" placeholder="What are you working toward?" />
      </div>
      <div class="form-row">
        <select id="goalCategory">
          <option value="work">Work</option>
          <option value="study">Study</option>
          <option value="creative">Creative</option>
          <option value="personal">Personal</option>
          <option value="health">Health</option>
          <option value="financial">Financial</option>
          <option value="relationship">Relationships</option>
        </select>
        <select id="goalTimeframe">
          <option value="short">Short-term</option>
          <option value="medium">Medium-term</option>
          <option value="long">Long-term</option>
        </select>
        <button class="btn-primary" onclick="addGoal()">Add</button>
      </div>
    </div>
    <div style="margin-bottom:20px">
      <div class="prompt-label" style="margin-bottom:14px">Active</div>
      <div class="goals-list" id="activeGoalsList"></div>
    </div>
    <div id="completedSection">
      <div class="prompt-label" style="margin-bottom:14px">Completed</div>
      <div class="goals-list" id="completedGoalsList"></div>
    </div>
  </div>

  <!-- ARCHIVE -->
  <div class="view" id="view-archive">
    <div class="section-title" style="margin-bottom:28px">Archive</div>
    <div id="archiveList"></div>
  </div>
</div>

<!-- Goal review modal -->
<div class="modal-overlay" id="goalModal">
  <div class="modal">
    <div class="modal-title">Time to revisit this.</div>
    <div class="modal-sub" id="goalModalSub">GOAL CHECK-IN</div>
    <div class="modal-goal" id="goalModalText"></div>
    <div class="modal-btn-row">
      <button class="btn-complete" onclick="resolveGoal('complete')">Mark complete</button>
      <button class="btn-remove" onclick="resolveGoal('remove')">Remove it</button>
      <button class="btn-keep" onclick="resolveGoal('keep')">Still working on it</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Google OAuth config ──────────────────────────────────
// Uses Google Identity Services (GIS) + Drive API
// Scope: only access files this app creates
const GDRIVE_CLIENT_ID = '86755695155-njkb18i6h80hkrsvl2rbia276u36j276.apps.googleusercontent.com'; // <-- replace this
const GDRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
const DRIVE_FILE_NAME = 'unfiltered-journal.json';

// ── State ────────────────────────────────────────────────
let DATA = { entries: {}, goals: [] };
let driveFileId = null;
let googleToken = null;
let autosaveTimer = null;
let isDirty = false;
let currentPrompt = null;
let goalModalCurrent = null;
let goalModalQueue = [];

// ── User profile ─────────────────────────────────────────
const USER_PROFILE = `
You are a personalised journal AI for someone named Nate.

IDENTITY: Care Coordinator at Wayside Chapel (Kings Cross), Sydney. Pursuing an acting Community Services Manager role at Wayside Bondi. Facilitates Men's Group and SMART Recovery. Completing counselling studies. Career moved from paramedicine into community care.

CORE VALUES: Curiosity, honesty, justice, creativity, self-reflection, growth, community impact, authenticity. Not performative about these.

CREATIVE IDENTITY: Identifies primarily as a writer. "Unfiltered Reflections" ethos. Uses Ulysses for writing.

PERSONALITY: Self-aware, direct, understated humour. Prefers specific and honest over generic. Comfortable with complexity.

ON HIS MIND: Transitioning into management, completing university while working, Google ecosystem migration, ATO tax debt, dating (Scruff, thoughtful approach).

WRITING STYLE: Varied, specific, no hedging, no filler, contractions fine, honest even when uncomfortable.
`;

const TYPE_LABELS = {
  reflective:'Reflection', creative:'Creative', identity:'Identity',
  tension:'Tension', goals_capture:'Goals', weekly_reflection:'Weekly Review',
  first_entry:'First Entry', forward_looking:'Forward'
};

// ── Utils ─────────────────────────────────────────────────
function todayKey() { return new Date().toISOString().split('T')[0]; }

function formatDate(iso) {
  return new Date(iso+'T12:00:00').toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}

function daysSince(iso) {
  return Math.floor((new Date()-new Date(iso+'T00:00:00'))/86400000);
}

function showToast(msg, col) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.borderLeftColor = col || 'var(--orange)';
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2800);
}

function renderDate() {
  const d = new Date();
  document.getElementById('dateDisplay').innerHTML =
    d.toLocaleDateString('en-AU',{weekday:'long'}).toUpperCase()+'<br>'+
    d.toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric'});
}

// ── Local storage fallback ────────────────────────────────
function loadLocal() {
  try { return JSON.parse(localStorage.getItem('uf_data') || 'null'); } catch { return null; }
}

function saveLocal(data) {
  try { localStorage.setItem('uf_data', JSON.stringify(data)); } catch {}
}

// ── Google Drive ──────────────────────────────────────────
function setSyncStatus(state) {
  const dot = document.getElementById('syncDot');
  const lbl = document.getElementById('syncLabel');
  dot.className = 'sync-dot ' + (state === 'ok' ? 'ok' : state === 'saving' ? 'saving' : state === 'error' ? 'error' : '');
  lbl.textContent = state === 'ok' ? 'synced' : state === 'saving' ? 'saving...' : state === 'error' ? 'sync error' : 'local only';
}

function signInGoogle(silent) {
  if (!window.google) {
    showToast('Google API not loaded. Check connection.', 'var(--red)');
    return;
  }
  const hint = localStorage.getItem('uf_google_hint') || '';
  const client = google.accounts.oauth2.initTokenClient({
    client_id: GDRIVE_CLIENT_ID,
    scope: GDRIVE_SCOPE,
    hint: hint,
    prompt: silent ? 'none' : '',
    callback: async (resp) => {
      if (resp.error) {
        if (silent) {
          // Silent failed — show banner for manual sign-in
          document.getElementById('authBanner').style.display = 'flex';
        } else {
          showToast('Sign-in failed.', 'var(--red)');
        }
        return;
      }
      googleToken = resp.access_token;
      // Store token expiry and hint
      localStorage.setItem('uf_had_google', '1');
      localStorage.setItem('uf_token_expiry', Date.now() + (resp.expires_in * 1000));
      // Store account hint for silent re-auth
      if (!hint) {
        // Try to get email from token info
        try {
          const info = await fetch('https://www.googleapis.com/oauth2/v3/tokeninfo?access_token=' + googleToken);
          const d = await info.json();
          if (d.email) localStorage.setItem('uf_google_hint', d.email);
        } catch {}
      }
      document.getElementById('authBanner').classList.add('hidden');
      await syncFromDrive();
    }
  });
  client.requestAccessToken();
}

function isTokenValid() {
  const expiry = localStorage.getItem('uf_token_expiry');
  if (!expiry) return false;
  return Date.now() < (parseInt(expiry) - 60000); // 1 min buffer
}

async function ensureToken() {
  if (googleToken && isTokenValid()) return true;
  // Try silent refresh
  return new Promise((resolve) => {
    if (!window.google) { resolve(false); return; }
    const hint = localStorage.getItem('uf_google_hint') || '';
    if (!hint) { resolve(false); return; }
    const client = google.accounts.oauth2.initTokenClient({
      client_id: GDRIVE_CLIENT_ID,
      scope: GDRIVE_SCOPE,
      hint: hint,
      prompt: 'none',
      callback: async (resp) => {
        if (resp.error) { resolve(false); return; }
        googleToken = resp.access_token;
        localStorage.setItem('uf_token_expiry', Date.now() + (resp.expires_in * 1000));
        resolve(true);
      }
    });
    client.requestAccessToken();
  });
}

async function driveRequest(method, url, body) {
  const headers = { 'Authorization': 'Bearer ' + googleToken };
  if (body && typeof body === 'object' && !(body instanceof FormData)) {
    headers['Content-Type'] = 'application/json';
    body = JSON.stringify(body);
  }
  const res = await fetch(url, { method, headers, body });
  if (!res.ok) throw new Error('Drive API error: ' + res.status);
  return res;
}

async function findDriveFile() {
  const res = await driveRequest('GET',
    `https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name='${DRIVE_FILE_NAME}'&fields=files(id,name)`);
  const data = await res.json();
  return data.files && data.files.length ? data.files[0].id : null;
}

async function readDriveFile(fileId) {
  const res = await driveRequest('GET',
    `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
  return await res.json();
}

async function writeDriveFile(data) {
  const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
  const form = new FormData();
  const meta = JSON.stringify(
    driveFileId
      ? {}
      : { name: DRIVE_FILE_NAME, parents: ['appDataFolder'] }
  );
  form.append('metadata', new Blob([meta], {type:'application/json'}));
  form.append('file', blob);

  const url = driveFileId
    ? `https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=multipart`
    : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
  const method = driveFileId ? 'PATCH' : 'POST';

  const res = await driveRequest(method, url, form);
  const result = await res.json();
  if (!driveFileId) driveFileId = result.id;
}

async function syncFromDrive() {
  try {
    setSyncStatus('saving');
    driveFileId = await findDriveFile();
    if (driveFileId) {
      const remote = await readDriveFile(driveFileId);
      // Merge: keep newer entries by savedAt
      const merged = { entries: { ...DATA.entries }, goals: DATA.goals };
      for (const [k, v] of Object.entries(remote.entries || {})) {
        if (!merged.entries[k] || new Date(v.savedAt) > new Date(merged.entries[k].savedAt)) {
          merged.entries[k] = v;
        }
      }
      // Goals: use remote if it has more, local wins on conflicts by id
      if ((remote.goals || []).length > 0) {
        const localIds = new Set(merged.goals.map(g=>g.id));
        for (const g of remote.goals) {
          if (!localIds.has(g.id)) merged.goals.push(g);
        }
      }
      DATA = merged;
      saveLocal(DATA);
    } else {
      // First time: push local data to Drive
      await writeDriveFile(DATA);
    }
    setSyncStatus('ok');
    showToast('Drive synced.', 'var(--green)');
    await refresh();
  } catch(e) {
    setSyncStatus('error');
    showToast('Sync failed — working offline.', 'var(--red)');
  }
}

async function pushToDrive() {
  const hadGoogle = localStorage.getItem('uf_had_google');
  if (!hadGoogle) return;
  const ok = await ensureToken();
  if (!ok) { setSyncStatus('error'); return; }
  try {
    setSyncStatus('saving');
    await writeDriveFile(DATA);
    setSyncStatus('ok');
  } catch {
    setSyncStatus('error');
    showToast('Could not save to Drive.', 'var(--red)');
  }
}

// ── Autosave draft ────────────────────────────────────────
function startAutosave() {
  const ta = document.getElementById('entryText');
  ta.addEventListener('input', () => {
    const words = ta.value.trim().split(/\s+/).filter(Boolean).length;
    document.getElementById('wordCount').textContent = words + ' word' + (words!==1?'s':'');

    // Save draft to localStorage immediately on every keystroke
    localStorage.setItem('uf_draft', JSON.stringify({
      date: todayKey(),
      promptDate: currentPrompt?.date,
      text: ta.value,
      savedAt: new Date().toISOString()
    }));

    const ind = document.getElementById('autosaveIndicator');
    ind.textContent = 'draft saved';
    ind.className = 'autosave-indicator saved';
    setTimeout(() => { ind.textContent = 'draft'; ind.className = 'autosave-indicator'; }, 1800);
  });
}

function restoreDraft() {
  try {
    const raw = localStorage.getItem('uf_draft');
    if (!raw) return;
    const draft = JSON.parse(raw);
    // Clear drafts from any previous day
    if (draft.date !== todayKey()) {
      localStorage.removeItem('uf_draft');
      return;
    }
    // Only restore if no saved entry for today
    if (DATA.entries[todayKey()]) return;
    const ta = document.getElementById('entryText');
    ta.value = draft.text;
    const words = draft.text.trim().split(/\s+/).filter(Boolean).length;
    document.getElementById('wordCount').textContent = words + ' word' + (words!==1?'s':'');
    if (draft.text.trim()) showToast('Draft restored.', 'var(--neon)');
  } catch {}
}

// ── Prompt generation ─────────────────────────────────────
async function generatePrompt() {
  const allKeys = Object.keys(DATA.entries).sort().reverse();
  const entryCount = allKeys.length;
  const recentEntries = allKeys.slice(0,5).map(k=>({
    date:k, prompt:DATA.entries[k].prompt, response:DATA.entries[k].response.substring(0,200)
  }));
  const activeGoals = DATA.goals.filter(g=>!g.completed&&!g.removed);
  const dayOfWeek = new Date().getDay();

  let typeInstruction = '';
  if (activeGoals.length===0 && entryCount>0) {
    typeInstruction='TYPE: goals_capture. Ask Nate what he is currently working toward — a meaningful goal or intention, not a to-do item.';
  } else if (dayOfWeek===0 && entryCount>=3) {
    typeInstruction='TYPE: weekly_reflection. Sunday. Ask something that encourages looking back — something noticed, shifted, or being carried forward.';
  } else if (entryCount===0) {
    typeInstruction="TYPE: first_entry. Nate's very first entry. Simple but real — an opener worth answering honestly.";
  } else {
    const types=['reflective','creative','identity','tension','forward_looking'];
    typeInstruction=`TYPE: ${types[Math.floor(Math.random()*types.length)]}. Generate a prompt fitting that type.`;
  }

  const systemPrompt = `${USER_PROFILE}

Generate a single daily journal prompt for Nate.

RULES:
- One or two sentences max. Tight.
- No preamble. Just the question.
- Never generic. Specific to who Nate is.
- Don't repeat recent prompts.
- Not therapist-y or saccharine. Honest, curious, occasionally challenging.

RECENT ENTRIES: ${JSON.stringify(recentEntries)}
ACTIVE GOALS: ${JSON.stringify(activeGoals.map(g=>g.text))}
${typeInstruction}

Return ONLY valid JSON: {"prompt":"Question here.","type":"reflective|creative|identity|tension|goals_capture|weekly_reflection|first_entry|forward_looking"}`;

  try {
    const res = await fetch('https://https://unfiltered-proxy.natevandervoort.workers.dev/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:300,
        system:systemPrompt,
        messages:[{role:'user',content:"Generate today's prompt."}]
      })
    });
    const data = await res.json();
    const text = data.content.map(b=>b.text||'').join('');
    return JSON.parse(text.replace(/```json|```/g,'').trim());
  } catch {
    return {prompt:"What's one thing you're not saying out loud right now?", type:'reflective'};
  }
}

function renderPromptBox(p) {
  document.getElementById('promptContainer').innerHTML=`
    <div class="prompt-box">
      <div class="prompt-type-badge">${TYPE_LABELS[p.type]||p.type}</div>
      <div class="prompt-text">${p.prompt}</div>
    </div>`;
}

async function loadTodayPrompt() {
  const today = todayKey();

  if (DATA.entries[today]) {
    document.getElementById('promptContainer').innerHTML='';
    document.getElementById('alreadyLogged').style.display='block';
    document.getElementById('entryArea').style.display='none';
    const preview = DATA.entries[today].response.substring(0,100);
    document.getElementById('todayPreview').textContent='"'+preview+(preview.length>=100?'...':'')+'"';
    return;
  }

  // Get or generate prompt (cache in localStorage so refresh doesn't regenerate)
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('uf_prompt')||'null'); } catch {}
  // Always regenerate if date has changed or no cache exists
  if (!saved || saved.date !== today) {
    localStorage.removeItem('uf_prompt'); // clear stale cache
    const p = await generatePrompt();
    saved = {date: today, ...p};
    localStorage.setItem('uf_prompt', JSON.stringify(saved));
  }

  currentPrompt = saved;
  renderPromptBox(saved);
  document.getElementById('entryArea').style.display='block';
  restoreDraft();
}

async function regeneratePrompt() {
  document.getElementById('promptContainer').innerHTML=`<div class="loading-prompt"><div class="pulse-dot"></div><div class="pulse-dot"></div><div class="pulse-dot"></div><span>Generating...</span></div>`;
  const p = await generatePrompt();
  currentPrompt = {date:todayKey(),...p};
  localStorage.setItem('uf_prompt', JSON.stringify(currentPrompt));
  renderPromptBox(currentPrompt);
}

// ── Save entry ────────────────────────────────────────────
async function saveEntry() {
  const text = document.getElementById('entryText').value.trim();
  if (!text) { showToast('Write something first.'); return; }
  if (!currentPrompt) return;

  DATA.entries[todayKey()] = {
    prompt: currentPrompt.prompt,
    type: currentPrompt.type,
    response: text,
    savedAt: new Date().toISOString()
  };

  saveLocal(DATA);
  localStorage.removeItem('uf_draft');

  document.getElementById('entryArea').style.display='none';
  const preview = text.substring(0,100);
  document.getElementById('todayPreview').textContent='"'+preview+(preview.length>=100?'...':'')+'"';
  document.getElementById('alreadyLogged').style.display='block';
  document.getElementById('promptContainer').innerHTML='';

  showToast('Entry saved.', 'var(--green)');
  renderStreak();
  await pushToDrive();
  await checkGoalReview();
}

// ── Streak ────────────────────────────────────────────────
function renderStreak() {
  const keys = Object.keys(DATA.entries).sort().reverse();
  let streak = 0;
  const today = todayKey();
  const todayDate = new Date(today + 'T12:00:00');
  for (let i = 0; i < keys.length; i++) {
    const exp = new Date(todayDate);
    exp.setDate(exp.getDate() - i);
    const expKey = exp.toISOString().split('T')[0];
    if (keys[i] === expKey) {
      streak++;
    } else {
      break;
    }
  }
  document.getElementById('streakNum').textContent=streak;
  const dots=document.getElementById('streakDots');
  dots.innerHTML='';
  for(let i=0;i<7;i++){
    const d=document.createElement('div');
    d.className='streak-dot'+(i<streak?' filled':'');
    dots.appendChild(d);
  }
}

// ── Goals ─────────────────────────────────────────────────
const CAT_COLORS={work:'#e8651a',study:'#7efff5',creative:'#d4a0ff',personal:'#f0ece5',health:'#40e87a',financial:'#e8d040',relationship:'#e86090'};

function renderGoals() {
  const active=DATA.goals.filter(g=>!g.completed&&!g.removed);
  const completed=DATA.goals.filter(g=>g.completed&&!g.removed);

  const goalHTML=(g,done)=>`
    <div class="goal-item${done?' completed':''}">
      <div class="goal-check${done?' checked':''}" onclick="toggleGoalComplete('${g.id}')"></div>
      <div class="goal-content">
        <div class="goal-text">${g.text}</div>
        <div class="goal-meta">
          <span style="color:${CAT_COLORS[g.category]||'#6b6760'}">${g.category}</span>
          <span>${g.timeframe}</span>
          <span>${formatDate(g.created)}</span>
        </div>
      </div>
      <div class="goal-actions"><button class="icon-btn" onclick="removeGoal('${g.id}')">✕</button></div>
    </div>`;

  document.getElementById('activeGoalsList').innerHTML=active.length?active.map(g=>goalHTML(g,false)).join(''):'<div class="empty-state">Nothing set yet.</div>';
  if(completed.length){
    document.getElementById('completedSection').style.display='block';
    document.getElementById('completedGoalsList').innerHTML=completed.map(g=>goalHTML(g,true)).join('');
  } else {
    document.getElementById('completedSection').style.display='none';
  }
}

function toggleAddGoal(){document.getElementById('addGoalForm').classList.toggle('open');}

async function addGoal(){
  const text=document.getElementById('goalInput').value.trim();
  if(!text)return;
  DATA.goals.push({id:Date.now().toString(),text,category:document.getElementById('goalCategory').value,timeframe:document.getElementById('goalTimeframe').value,created:todayKey(),completed:false,removed:false});
  document.getElementById('goalInput').value='';
  document.getElementById('addGoalForm').classList.remove('open');
  saveLocal(DATA); renderGoals(); showToast('Goal added.');
  await pushToDrive();
}

async function toggleGoalComplete(id){
  const g=DATA.goals.find(x=>x.id===id);
  if(g){g.completed=!g.completed;g.completedAt=g.completed?todayKey():null;}
  saveLocal(DATA); renderGoals(); await pushToDrive();
}

async function removeGoal(id){
  const g=DATA.goals.find(x=>x.id===id);
  if(g) g.removed=true;
  saveLocal(DATA); renderGoals(); showToast('Goal removed.'); await pushToDrive();
}

async function checkGoalReview(){
  const today=todayKey();
  const lastCheck=localStorage.getItem('uf_last_goal_check');
  if(lastCheck===today)return;
  const stale=DATA.goals.filter(g=>!g.completed&&!g.removed&&daysSince(g.created)>=14);
  if(!stale.length)return;
  localStorage.setItem('uf_last_goal_check',today);
  goalModalQueue=[...stale];
  showNextGoalModal();
}

function showNextGoalModal(){
  if(!goalModalQueue.length)return;
  goalModalCurrent=goalModalQueue.shift();
  document.getElementById('goalModalText').textContent=goalModalCurrent.text;
  document.getElementById('goalModalSub').textContent=`GOAL — ${goalModalCurrent.category.toUpperCase()} · ${daysSince(goalModalCurrent.created)} days old`;
  document.getElementById('goalModal').classList.add('open');
}

async function resolveGoal(action){
  document.getElementById('goalModal').classList.remove('open');
  if(!goalModalCurrent)return;
  const g=DATA.goals.find(x=>x.id===goalModalCurrent.id);
  if(g){
    if(action==='complete'){g.completed=true;g.completedAt=todayKey();showToast('Marked complete.','var(--green)');}
    if(action==='remove'){g.removed=true;showToast('Removed.');}
    if(action==='keep'){g.created=todayKey();showToast('Still in play.');}
  }
  saveLocal(DATA); await pushToDrive();
  setTimeout(showNextGoalModal,400);
}

// ── Archive ───────────────────────────────────────────────
function renderArchive(){
  // Deduplicate by date key, sort newest first
  const seen = new Set();
  const keys = Object.keys(DATA.entries)
    .filter(k => {
      if (seen.has(k)) return false;
      seen.add(k);
      return true;
    })
    .sort()
    .reverse();

  const el = document.getElementById('archiveList');
  if (!keys.length) { el.innerHTML = '<div class="empty-state">Nothing yet. Write your first entry.</div>'; return; }
  el.innerHTML = keys.map(k => {
    const e = DATA.entries[k];
    const preview = e.response.substring(0, 120);
    return `<div class="entry-item" onclick="toggleEntry('${k}')">
      <div class="entry-date"><span>${formatDate(k)}</span><span style="color:var(--orange-dim)">${TYPE_LABELS[e.type] || e.type}</span></div>
      <div class="entry-prompt-preview">${e.prompt}</div>
      <div class="entry-response-preview">${preview}${e.response.length > 120 ? '...' : ''}</div>
      <div class="entry-expanded" id="exp-${k}"><div class="entry-full">${e.response}</div></div>
    </div>`;
  }).join('');
}

function toggleEntry(key){document.getElementById('exp-'+key).classList.toggle('open');}

// ── Nav ───────────────────────────────────────────────────
function switchView(name, btn){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  if(btn) btn.classList.add('active');
  if(name==='archive') renderArchive();
  if(name==='goals') renderGoals();
}

// ── Refresh UI ────────────────────────────────────────────
async function refresh(){
  renderStreak();
  await loadTodayPrompt();
}

// ── Init ──────────────────────────────────────────────────
async function init(){
  renderDate();

  // Load from local first (instant)
  const local = loadLocal();
  if(local) DATA = local;

  renderStreak();
  await loadTodayPrompt();
  startAutosave();

  // Load Google Identity Services
  const gisScript = document.createElement('script');
  gisScript.src = 'https://accounts.google.com/gsi/client';
  gisScript.onload = () => {
    const hadAuth = localStorage.getItem('uf_had_google');
    const hint = localStorage.getItem('uf_google_hint');
    if (hadAuth && hint) {
      // Attempt silent token refresh automatically
      signInGoogle(true);
    } else {
      document.getElementById('authBanner').style.display = 'flex';
    }
  };
  gisScript.onerror = () => {
    document.getElementById('authBanner').classList.add('hidden');
  };
  document.head.appendChild(gisScript);
}

init();
</script>
